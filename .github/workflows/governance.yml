name: Monorepo Governance

on:
  pull_request:
    branches:
      - main
      - develop
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
      - develop
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-and-branch-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ''
        run: npm ci --workspaces=false --ignore-scripts

      - name: Validate branch naming
        run: node apps/api/scripts/git/validate-branch-name.js "${{ github.head_ref }}"

      - name: Validate conventional commits
        run: |
          npx --no-install commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ''
        run: npm ci

      - name: Lint monorepo
        run: npm run lint

      - name: Type-check monorepo
        run: npm run check-types

      - name: Test monorepo
        run: npm run test:ci
