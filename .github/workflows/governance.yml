name: Monorepo Governance

on:
  pull_request:
    branches:
      - main
      - develop
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
      - develop
      - dev

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  commit-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ''
        run: npm ci --workspaces=false --ignore-scripts --include=optional

      - name: Validate conventional commits
        run: |
          npx --no-install commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ''
        run: npm ci --include=optional

      - name: Detect changed workspaces
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            root:
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            web:
              - 'apps/web/**'
            api:
              - 'apps/api/**'
            rag_service:
              - 'apps/rag-service/**'
            types:
              - 'packages/types/**'
            shared_configs:
              - 'packages/eslint-config/**'
              - 'packages/typescript-config/**'

      - name: Lint and type-check shared types
        if: steps.changes.outputs.root == 'true' || steps.changes.outputs.types == 'true' || steps.changes.outputs.shared_configs == 'true'
        run: |
          npm run lint --workspace @repo/types
          npm run check-types --workspace @repo/types

      - name: Lint and type-check web
        if: steps.changes.outputs.root == 'true' || steps.changes.outputs.web == 'true' || steps.changes.outputs.shared_configs == 'true'
        run: |
          npm run lint --workspace web
          npm run check-types --workspace web

      - name: Verify backend
        if: steps.changes.outputs.root == 'true' || steps.changes.outputs.api == 'true' || steps.changes.outputs.types == 'true'
        run: |
          npm run lint:check --workspace blih-system-backend
          npm run check-types --workspace blih-system-backend
          npm run test --workspace blih-system-backend -- --ci --passWithNoTests

      - name: Verify rag service
        if: steps.changes.outputs.root == 'true' || steps.changes.outputs.rag_service == 'true' || steps.changes.outputs.shared_configs == 'true'
        run: |
          npm run lint:check --workspace rag-service
          npm run check-types --workspace rag-service
          npm run test --workspace rag-service -- --ci --passWithNoTests

      - name: No scoped verification needed
        if: steps.changes.outputs.root != 'true' && steps.changes.outputs.web != 'true' && steps.changes.outputs.api != 'true' && steps.changes.outputs.rag_service != 'true' && steps.changes.outputs.types != 'true' && steps.changes.outputs.shared_configs != 'true'
        run: echo "No application or shared workspace changes detected."
