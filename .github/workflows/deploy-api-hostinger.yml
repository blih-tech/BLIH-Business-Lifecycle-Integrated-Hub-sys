name: Deploy API to Hostinger

on:
  push:
    branches:
      - dev
    paths:
      - 'apps/api/**'
      - 'packages/types/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional pre-built image tag to deploy (defaults to current commit SHA)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-api-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          # Use npm install instead of ci for better compatibility
          # and to avoid Windows file permission issues
          npm install --workspaces --include-workspace-root --include=optional

      - name: Verify shared types
        run: |
          npm run lint --workspace @repo/types
          npm run check-types --workspace @repo/types

      - name: Verify backend
        run: |
          npm run lint:check --workspace blih-system-backend
          npm run check-types --workspace blih-system-backend
          npm run test --workspace blih-system-backend -- --ci --passWithNoTests

  build-images:
    needs: verify
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      api_runtime_image: ${{ steps.meta.outputs.api_runtime_image }}
      api_migrator_image: ${{ steps.meta.outputs.api_migrator_image }}
      keycloak_image: ${{ steps.meta.outputs.keycloak_image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_tag="${GITHUB_SHA}"
          api_runtime_image="ghcr.io/${owner_lc}/blih-api-runtime:${image_tag}"
          api_migrator_image="ghcr.io/${owner_lc}/blih-api-migrator:${image_tag}"
          keycloak_image="ghcr.io/${owner_lc}/blih-keycloak:${image_tag}"

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "api_runtime_image=${api_runtime_image}" >> "$GITHUB_OUTPUT"
          echo "api_migrator_image=${api_migrator_image}" >> "$GITHUB_OUTPUT"
          echo "keycloak_image=${keycloak_image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.api_runtime_image }}

      - name: Build and push API migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrator
          push: true
          tags: ${{ steps.meta.outputs.api_migrator_image }}

      - name: Build and push Keycloak image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/keycloak/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.keycloak_image }}

  resolve-images:
    needs:
      - verify
      - build-images
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      api_runtime_image: ${{ steps.resolve.outputs.api_runtime_image }}
      api_migrator_image: ${{ steps.resolve.outputs.api_migrator_image }}
      keycloak_image: ${{ steps.resolve.outputs.keycloak_image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve deploy image tags
        id: resolve
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_tag=""

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.image_tag }}" ]]; then
            image_tag="${{ inputs.image_tag }}"
          else
            image_tag="${{ needs.build-images.outputs.image_tag }}"
          fi

          if [[ -z "${image_tag}" ]]; then
            echo "Unable to resolve image tag for deployment."
            exit 1
          fi

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "api_runtime_image=ghcr.io/${owner_lc}/blih-api-runtime:${image_tag}" >> "$GITHUB_OUTPUT"
          echo "api_migrator_image=ghcr.io/${owner_lc}/blih-api-migrator:${image_tag}" >> "$GITHUB_OUTPUT"
          echo "keycloak_image=ghcr.io/${owner_lc}/blih-keycloak:${image_tag}" >> "$GITHUB_OUTPUT"

  deploy:
    needs:
      - resolve-images
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
      GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API_IMAGE: ${{ needs.resolve-images.outputs.api_runtime_image }}
      API_MIGRATOR_IMAGE: ${{ needs.resolve-images.outputs.api_migrator_image }}
      KEYCLOAK_IMAGE: ${{ needs.resolve-images.outputs.keycloak_image }}
      IMAGE_TAG: ${{ needs.resolve-images.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare SSH
        run: |
          echo "Checking required secrets..."
          echo "HOSTINGER_SSH_HOST is set: $(if [ -n "${HOSTINGER_SSH_HOST}" ]; then echo "YES"; else echo "NO"; fi)"
          echo "HOSTINGER_SSH_USER is set: $(if [ -n "${HOSTINGER_SSH_USER}" ]; then echo "YES"; else echo "NO"; fi)"
          echo "HOSTINGER_SSH_KEY is set: $(if [ -n "${HOSTINGER_SSH_KEY}" ]; then echo "YES"; else echo "NO"; fi)"
          echo "HOSTINGER_DEPLOY_PATH is set: $(if [ -n "${HOSTINGER_DEPLOY_PATH}" ]; then echo "YES"; else echo "NO"; fi)"

          : "${HOSTINGER_SSH_HOST:?HOSTINGER_SSH_HOST secret is required}"
          : "${HOSTINGER_SSH_USER:?HOSTINGER_SSH_USER secret is required}"
          : "${HOSTINGER_SSH_KEY:?HOSTINGER_SSH_KEY secret is required}"
          : "${HOSTINGER_DEPLOY_PATH:?HOSTINGER_DEPLOY_PATH secret is required}"
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "${HOSTINGER_SSH_KEY}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keygen -yf ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "HOSTINGER_SSH_KEY is not a valid private key. Check that the GitHub secret contains the full unencrypted key."
            exit 1
          fi

          # Write SSH client config for all subsequent steps: timeouts, keepalives, retry
          printf 'Host %s\n  Port %s\n  IdentityFile ~/.ssh/id_ed25519\n  ConnectTimeout 30\n  ServerAliveInterval 60\n  ServerAliveCountMax 5\n  TCPKeepAlive yes\n' \
            "${HOSTINGER_SSH_HOST}" "${HOSTINGER_SSH_PORT}" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # Try ssh-keyscan up to 3 times with a 30s timeout.
          # Hostinger (and many hosters) rate-limit external port scans, so
          # a single 15s attempt is often not enough. If all attempts fail we
          # fall back to StrictHostKeyChecking=accept-new which auto-adds the
          # host key on the first real SSH connection instead.
          keyscan_ok=false
          for attempt in 1 2 3; do
            echo "ssh-keyscan attempt ${attempt}/3..."
            if ssh-keyscan \
                -o KexAlgorithms=+diffie-hellman-group14-sha256 \
                -T 30 \
                -p "${HOSTINGER_SSH_PORT}" \
                "${HOSTINGER_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null; then
              keyscan_ok=true
              echo "Host key obtained via ssh-keyscan."
              break
            fi
            sleep $((attempt * 5))
          done

          if [[ "${keyscan_ok}" != "true" ]]; then
            echo "ssh-keyscan could not reach the host after 3 attempts."
            echo "Falling back to StrictHostKeyChecking=accept-new (host key will be saved on first connection)."
            # Append the fallback setting; it overrides the Host block above only for StrictHostKeyChecking
            echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config
          fi

      - name: Sync deploy manifests to Hostinger
        run: |
          # Port, identity file, and host-key settings are all in ~/.ssh/config
          # so plain `ssh` and `rsync -e ssh` pick them up automatically.
          remote="${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}"
          ssh "${remote}" "mkdir -p '${HOSTINGER_DEPLOY_PATH}'"
          rsync -az --checksum \
            apps/api/docker-compose.prod.yml \
            "${remote}:${HOSTINGER_DEPLOY_PATH}/"
          rsync -az --checksum \
            apps/api/deploy.sh \
            "${remote}:${HOSTINGER_DEPLOY_PATH}/"
          rsync -az --checksum \
            apps/api/healthcheck.sh \
            "${remote}:${HOSTINGER_DEPLOY_PATH}/"
          rsync -az --checksum \
            apps/api/.env.production \
            "${remote}:${HOSTINGER_DEPLOY_PATH}/.env.production"
          rsync -az --checksum \
            apps/api/keycloak/import/ \
            "${remote}:${HOSTINGER_DEPLOY_PATH}/keycloak/import/"
          rsync -az --checksum \
            apps/api/nginx/ \
            "${remote}:${HOSTINGER_DEPLOY_PATH}/nginx/"

      - name: Apply nginx configuration
        run: |
          remote="${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}"
          ssh "${remote}" "
            set -euo pipefail
            NGINX_AVAILABLE=/etc/nginx/sites-available
            NGINX_ENABLED=/etc/nginx/sites-enabled

            for conf in '${HOSTINGER_DEPLOY_PATH}/nginx/'*.conf; do
              name=\$(basename \"\$conf\")
              sudo cp \"\$conf\" \"\${NGINX_AVAILABLE}/\${name}\"
              sudo ln -sf \"\${NGINX_AVAILABLE}/\${name}\" \"\${NGINX_ENABLED}/\${name}\"
              echo \"Installed nginx config: \${name}\"
            done

            sudo nginx -t
            sudo systemctl reload nginx
            echo 'nginx reloaded successfully'
          "

      - name: Run remote deploy script
        run: |
          # Port, identity, and host-key settings come from ~/.ssh/config
          remote="${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}"
          api_image_escaped="$(printf '%q' "${API_IMAGE}")"
          api_migrator_image_escaped="$(printf '%q' "${API_MIGRATOR_IMAGE}")"
          keycloak_image_escaped="$(printf '%q' "${KEYCLOAK_IMAGE}")"
          ghcr_token_escaped="$(printf '%q' "${GHCR_PULL_TOKEN}")"
          git_sha_escaped="$(printf '%q' "${GITHUB_SHA}")"

          ssh "${remote}" \
            "set -euo pipefail; cd '${HOSTINGER_DEPLOY_PATH}'; chmod +x deploy.sh healthcheck.sh; \
            API_IMAGE=${api_image_escaped} \
            API_MIGRATOR_IMAGE=${api_migrator_image_escaped} \
            KEYCLOAK_IMAGE=${keycloak_image_escaped} \
            GHCR_TOKEN=${ghcr_token_escaped} \
            GIT_SHA=${git_sha_escaped} \
            COMPOSE_FILE=docker-compose.prod.yml \
            ENV_FILE=.env.production \
            ./deploy.sh"
