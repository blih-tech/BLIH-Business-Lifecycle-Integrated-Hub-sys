# Keycloak reverse proxy
# Container port mapping: 127.0.0.1:8180 -> container:8080
# Do NOT change 8180 — it matches KEYCLOAK_PORT in docker-compose.prod.yml

server {
    listen 80;
    server_name keycloak.blihmarketing.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name keycloak.blihmarketing.com;

    ssl_certificate     /etc/letsencrypt/live/keycloak.blihmarketing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keycloak.blihmarketing.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Required for Keycloak large cookie / token headers
    proxy_buffer_size        128k;
    proxy_buffers            4 256k;
    proxy_busy_buffers_size  256k;

    location / {
        proxy_pass              http://127.0.0.1:8180;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      90s;
        proxy_connect_timeout   90s;
    }
}
