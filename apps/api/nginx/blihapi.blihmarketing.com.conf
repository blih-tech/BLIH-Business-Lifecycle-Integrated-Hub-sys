# BLIH API reverse proxy
# Container port mapping: 127.0.0.1:5000 -> container:5000
# Do NOT change 5000 — it matches API_PORT / PORT in .env.production

server {
    listen 80;
    server_name blihapi.blihmarketing.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name blihapi.blihmarketing.com;

    ssl_certificate     /etc/letsencrypt/live/blihapi.blihmarketing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blihapi.blihmarketing.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass              http://127.0.0.1:5000;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      120s;
        proxy_connect_timeout   30s;
    }
}
