# Keycloak service - reads from .env (run from repo root: docker compose -f docker/docker-compose.yml up)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3
    container_name: blih-keycloak
    ports:
      - '${KEYCLOAK_PORT:-127.0.0.1:8080:8080}'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL:-jdbc:postgresql://postgres:5432/keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Injected into realm import for blih-system-api client secret (realm-export.json uses ${BLIH_KEYCLOAK_CLIENT_SECRET})
      BLIH_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/data:/opt/keycloak/data
    command: start-dev --import-realm --features=preview
    depends_on:
      - postgres
