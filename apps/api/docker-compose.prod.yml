services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: ${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE is required}
    restart: unless-stopped
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-1g}
    cpus: ${KEYCLOAK_CPU_LIMIT:-0.5}
    command:
      [
        'start',
        '--http-enabled=true',
        '--import-realm',
        '--hostname-strict=false',
        '--http-relative-path=/',
        '--proxy-headers=xforwarded',
        '--hostname=${KEYCLOAK_HOSTNAME:-localhost}',
      ]
    env_file:
      - .env.production
    environment:
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL}
      KC_HOSTNAME_URL: ${KEYCLOAK_HOSTNAME_URL}
      KC_HOSTNAME_ADMIN_URL: ${KEYCLOAK_HOSTNAME_ADMIN_URL}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HTTPS_ENABLED: ${KEYCLOAK_HTTPS_ENABLED}
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'timeout 10 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/8080" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-0.5}
    command: ['npm', 'run', 'start:prod']
    env_file:
      - .env.production
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    ports:
      - '${API_PORT:-5000}:5000'
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'ss -tlnp | grep :5000 || exit 1']
      interval: ${HEALTH_CHECK_INTERVAL:-15s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-8}
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
